<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FTC Jember — URL Shortener</title>
  <style>
    :root {
      --bg: #f9f8f6;
      --surface: #ffffff;
      --border: #e5e2db;
      --text: #1a1a1a;
      --muted: #6b6b6b;
      --hint: #999;
      --accent: #111111;
      --accent-fg: #ffffff;
      --danger: #c0392b;
      --success: #1a7a4a;
      --info: #1a5fa8;
      --mono: 'Courier New', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }

    /* ── layout ── */
    .app { max-width: 1100px; margin: 0 auto; padding: 0 1.5rem 3rem; }

    /* ── header ── */
    header { display: flex; align-items: center; gap: 12px; padding: 1.5rem 0 1.25rem; border-bottom: 1px solid var(--border); margin-bottom: 1.5rem; }
    .logo { background: var(--accent); color: var(--accent-fg); font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 6px; letter-spacing: 1px; }
    header h1 { font-size: 16px; font-weight: 600; }
    .domain-badge { font-family: var(--mono); font-size: 12px; background: #f0ede8; border: 1px solid var(--border); padding: 3px 9px; border-radius: 20px; color: var(--muted); margin-left: auto; }

    /* ── login gate ── */
    #login-screen { max-width: 380px; margin: 5rem auto; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; text-align: center; }
    #login-screen h2 { font-size: 18px; margin-bottom: .5rem; }
    #login-screen p { font-size: 13px; color: var(--muted); margin-bottom: 1.25rem; }
    #login-screen input { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 7px; font-size: 14px; margin-bottom: 10px; }
    #login-screen button { width: 100%; background: var(--accent); color: var(--accent-fg); border: none; padding: 10px; border-radius: 7px; font-size: 14px; font-weight: 600; cursor: pointer; }
    #login-error { color: var(--danger); font-size: 12px; margin-top: 6px; min-height: 16px; }

    /* ── stats ── */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1.5rem; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
    .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 4px; }
    .stat-value { font-size: 26px; font-weight: 700; }

    /* ── create box ── */
    .create-box { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1.25rem; margin-bottom: 1.5rem; }
    .box-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); margin-bottom: 10px; }
    .create-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .slug-prefix { font-family: var(--mono); font-size: 13px; color: var(--muted); white-space: nowrap; background: #f4f2ee; border: 1px solid var(--border); padding: 8px 10px; border-radius: 7px 0 0 7px; }
    input.slug-inp { font-family: var(--mono); font-size: 13px; border: 1px solid var(--border); border-left: none; padding: 8px 10px; border-radius: 0 7px 7px 0; width: 160px; outline: none; background: var(--surface); }
    input.slug-inp:focus { border-color: var(--accent); }
    .arrow { color: var(--hint); font-size: 18px; }
    input.dest-inp { flex: 1; min-width: 200px; border: 1px solid var(--border); padding: 8px 12px; border-radius: 7px; font-size: 13px; outline: none; background: var(--surface); }
    input.dest-inp:focus { border-color: var(--accent); }
    .btn-create { background: var(--accent); color: var(--accent-fg); border: none; padding: 9px 20px; border-radius: 7px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .btn-create:hover { opacity: .85; }
    .btn-create:disabled { opacity: .5; cursor: not-allowed; }
    .create-msg { font-size: 12px; margin-top: 8px; min-height: 16px; }
    .ok { color: var(--success); } .err { color: var(--danger); }

    /* ── table toolbar ── */
    .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .toolbar-title { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
    .search-inp { font-size: 12px; padding: 6px 12px; border: 1px solid var(--border); border-radius: 20px; background: var(--surface); color: var(--text); outline: none; width: 160px; }
    .search-inp:focus { border-color: var(--accent); }

    /* ── table ── */
    .tbl-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    thead { background: #f4f2ee; }
    th { text-align: left; padding: 10px 14px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); border-bottom: 1px solid var(--border); }
    td { padding: 10px 14px; border-bottom: 1px solid #f0ede8; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafaf8; }

    .slug-link { font-family: var(--mono); color: var(--info); font-weight: 600; font-size: 13px; text-decoration: none; }
    .slug-link:hover { text-decoration: underline; }
    .dest-text { color: var(--muted); font-size: 12px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
    .badge-clicks { display: inline-block; background: #f0ede8; border-radius: 20px; padding: 2px 10px; font-size: 12px; font-weight: 600; }
    .ts { font-size: 11px; color: var(--hint); }
    .ip-text { font-family: var(--mono); font-size: 11px; color: var(--hint); }
    .status-on { font-size: 11px; color: var(--success); font-weight: 600; }
    .status-off { font-size: 11px; color: var(--danger); font-weight: 600; }

    .actions { display: flex; gap: 5px; flex-wrap: wrap; }
    .btn { padding: 4px 10px; font-size: 11px; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; background: var(--surface); color: var(--text); font-weight: 500; }
    .btn:hover { background: #f4f2ee; }
    .btn-danger { color: var(--danger); border-color: #f5c0bb; }
    .btn-danger:hover { background: #fff5f5; }
    .btn-toggle { color: var(--muted); }

    .empty-row td { text-align: center; padding: 3rem; color: var(--hint); font-size: 13px; }

    /* ── logs modal ── */
    .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100; align-items: center; justify-content: center; }
    .modal-bg.open { display: flex; }
    .modal { background: var(--surface); border-radius: 12px; padding: 1.5rem; max-width: 680px; width: 95%; max-height: 80vh; overflow-y: auto; }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .modal-header h3 { font-size: 15px; }
    .btn-close { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 13px; }

    @media (max-width: 600px) {
      .stats { grid-template-columns: 1fr 1fr; }
      .create-row { flex-direction: column; align-items: stretch; }
      .slug-prefix, input.slug-inp { border-radius: 7px; border-left: 1px solid var(--border); }
    }
  </style>
</head>
<body>

<!-- ── Login Screen ── -->
<div id="login-screen">
  <h2>FTC Jember Shortlink</h2>
  <p>Masukkan Admin Secret untuk lanjut</p>
  <input type="password" id="secret-inp" placeholder="Admin secret..." onkeydown="if(event.key==='Enter')doLogin()"/>
  <button onclick="doLogin()">Masuk</button>
  <div id="login-error"></div>
</div>

<!-- ── Main App (hidden until login) ── -->
<div class="app" id="main-app" style="display:none">
  <header>
    <span class="logo">FTC</span>
    <h1>Jember URL Shortener</h1>
    <span class="domain-badge">ftcjember.com</span>
    <button class="btn" style="margin-left:12px" onclick="doLogout()">Logout</button>
  </header>

  <div class="stats">
    <div class="stat"><div class="stat-label">Total Link</div><div class="stat-value" id="s-total">—</div></div>
    <div class="stat"><div class="stat-label">Total Klik</div><div class="stat-value" id="s-clicks">—</div></div>
    <div class="stat"><div class="stat-label">Link Aktif</div><div class="stat-value" id="s-active">—</div></div>
  </div>

  <div class="create-box">
    <div class="box-title">Buat Short Link Baru</div>
    <div class="create-row">
      <span class="slug-prefix">ftcjember.com/</span>
      <input class="slug-inp" type="text" id="slug-inp" placeholder="custom-slug" maxlength="60"/>
      <span class="arrow">→</span>
      <input class="dest-inp" type="text" id="dest-inp" placeholder="https://tujuan.com/panjang/sekali"/>
      <button class="btn-create" id="btn-create" onclick="createLink()">+ Buat Link</button>
    </div>
    <div class="create-msg" id="create-msg"></div>
  </div>

  <div class="toolbar">
    <span class="toolbar-title">Semua Link</span>
    <input class="search-inp" type="text" placeholder="Cari slug..." oninput="loadLinks(this.value)"/>
  </div>
  <div class="tbl-wrap">
    <table>
      <thead>
        <tr>
          <th>Short Link</th>
          <th>Destination</th>
          <th style="text-align:center">Klik</th>
          <th>Dibuat</th>
          <th>Last IP</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tbl-body">
        <tr class="empty-row"><td colspan="7">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- ── Click Log Modal ── -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">Click Logs</h3>
      <button class="btn-close" onclick="closeModal()">Tutup</button>
    </div>
    <table style="width:100%;border-collapse:collapse;font-size:12px">
      <thead>
        <tr style="background:#f4f2ee">
          <th style="padding:7px 10px;text-align:left;border-bottom:1px solid var(--border)">Waktu</th>
          <th style="padding:7px 10px;text-align:left;border-bottom:1px solid var(--border)">IP</th>
          <th style="padding:7px 10px;text-align:left;border-bottom:1px solid var(--border)">Referer</th>
          <th style="padding:7px 10px;text-align:left;border-bottom:1px solid var(--border)">User Agent</th>
        </tr>
      </thead>
      <tbody id="log-body"></tbody>
    </table>
  </div>
</div>

<script>
// ── Config — ganti sesuai URL backend lo ──────────────────────────────────
const API_BASE = 'shortlink-back-production.up.railway.app'; // ganti ini!

let adminSecret = '@Farmer123';

// ── Login ──────────────────────────────────────────────────────────────────
function doLogin() {
  const val = document.getElementById('secret-inp').value.trim();
  if (!val) { document.getElementById('login-error').textContent = 'Masukkan secret dulu!'; return; }
  adminSecret = val;
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('main-app').style.display = 'block';
  loadStats();
  loadLinks();
}

function doLogout() {
  adminSecret = '';
  document.getElementById('secret-inp').value = '';
  document.getElementById('login-error').textContent = '';
  document.getElementById('login-screen').style.display = 'block';
  document.getElementById('main-app').style.display = 'none';
}

function headers() {
  return { 'Content-Type': 'application/json', 'x-admin-secret': adminSecret };
}

// ── Stats ──────────────────────────────────────────────────────────────────
async function loadStats() {
  try {
    const res = await fetch(`${API_BASE}/api/stats`, { headers: headers() });
    const json = await res.json();
    if (!res.ok) throw new Error(json.error);
    document.getElementById('s-total').textContent = json.total_links;
    document.getElementById('s-clicks').textContent = json.total_clicks;
  } catch (e) { console.error('Stats error:', e); }
}

// ── Load Links ─────────────────────────────────────────────────────────────
async function loadLinks(search = '') {
  const tbody = document.getElementById('tbl-body');
  tbody.innerHTML = '<tr class="empty-row"><td colspan="7">Loading...</td></tr>';
  try {
    const url = `${API_BASE}/api/links?limit=200${search ? '&search=' + encodeURIComponent(search) : ''}`;
    const res = await fetch(url, { headers: headers() });
    const json = await res.json();
    if (!res.ok) throw new Error(json.error);
    renderTable(json.data);
    updateActiveCount(json.data);
  } catch (e) {
    tbody.innerHTML = `<tr class="empty-row"><td colspan="7">Error: ${e.message}</td></tr>`;
  }
}

function updateActiveCount(data) {
  document.getElementById('s-active').textContent = data.filter(l => l.active).length;
}

function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' })
    + ' ' + d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
}

function renderTable(data) {
  const tbody = document.getElementById('tbl-body');
  if (!data.length) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="7">Belum ada link. Buat yang pertama!</td></tr>';
    return;
  }
  tbody.innerHTML = data.map(l => `
    <tr>
      <td>
        <a class="slug-link" href="${API_BASE}/${l.slug}" target="_blank">/${l.slug}</a>
      </td>
      <td><span class="dest-text" title="${l.destination}">${l.destination}</span></td>
      <td style="text-align:center"><span class="badge-clicks">${l.total_clicks}</span></td>
      <td class="ts">${fmtDate(l.created_at)}</td>
      <td class="ip-text">${l.last_ip || '—'}</td>
      <td class="${l.active ? 'status-on' : 'status-off'}">${l.active ? 'Aktif' : 'Mati'}</td>
      <td>
        <div class="actions">
          <button class="btn" onclick="copyLink('${l.slug}')">Copy</button>
          <button class="btn btn-toggle" onclick="toggleLink('${l.slug}', ${l.active})">${l.active ? 'Nonaktifkan' : 'Aktifkan'}</button>
          <button class="btn" onclick="showLogs('${l.slug}')">Log</button>
          <button class="btn btn-danger" onclick="deleteLink('${l.slug}')">Hapus</button>
        </div>
      </td>
    </tr>
  `).join('');
}

// ── Create Link ────────────────────────────────────────────────────────────
async function createLink() {
  const slug = document.getElementById('slug-inp').value.trim().toLowerCase();
  const dest = document.getElementById('dest-inp').value.trim();
  const msg = document.getElementById('create-msg');
  const btn = document.getElementById('btn-create');

  msg.className = 'create-msg';

  if (!slug) { msg.className = 'create-msg err'; msg.textContent = 'Slug tidak boleh kosong!'; return; }
  if (!dest || !/^https?:\/\//.test(dest)) { msg.className = 'create-msg err'; msg.textContent = 'URL tujuan harus valid (mulai https://)'; return; }

  btn.disabled = true; btn.textContent = 'Membuat...';

  try {
    const res = await fetch(`${API_BASE}/api/links`, {
      method: 'POST', headers: headers(), body: JSON.stringify({ slug, destination: dest })
    });
    const json = await res.json();
    if (!res.ok) throw new Error(json.error);

    msg.className = 'create-msg ok';
    msg.textContent = `Berhasil! → ftcjember.com/${slug}`;
    document.getElementById('slug-inp').value = '';
    document.getElementById('dest-inp').value = '';
    loadStats(); loadLinks();
  } catch (e) {
    msg.className = 'create-msg err'; msg.textContent = e.message;
  } finally {
    btn.disabled = false; btn.textContent = '+ Buat Link';
    setTimeout(() => { msg.textContent = ''; }, 4000);
  }
}

// ── Copy ───────────────────────────────────────────────────────────────────
function copyLink(slug) {
  navigator.clipboard.writeText(`https://ftcjember.com/${slug}`);
}

// ── Toggle aktif/nonaktif ──────────────────────────────────────────────────
async function toggleLink(slug, currentActive) {
  try {
    const res = await fetch(`${API_BASE}/api/links/${slug}`, {
      method: 'PATCH', headers: headers(), body: JSON.stringify({ active: !currentActive })
    });
    const json = await res.json();
    if (!res.ok) throw new Error(json.error);
    loadLinks();
  } catch (e) { alert('Gagal: ' + e.message); }
}

// ── Delete ─────────────────────────────────────────────────────────────────
async function deleteLink(slug) {
  if (!confirm(`Yakin hapus /${slug}? Data klik juga akan ikut terhapus.`)) return;
  try {
    const res = await fetch(`${API_BASE}/api/links/${slug}`, { method: 'DELETE', headers: headers() });
    const json = await res.json();
    if (!res.ok) throw new Error(json.error);
    loadStats(); loadLinks();
  } catch (e) { alert('Gagal hapus: ' + e.message); }
}

// ── Click Logs Modal ───────────────────────────────────────────────────────
async function showLogs(slug) {
  document.getElementById('modal-title').textContent = `Click Logs — /${slug}`;
  document.getElementById('log-body').innerHTML = '<tr><td colspan="4" style="padding:1rem;text-align:center;color:var(--hint)">Loading...</td></tr>';
  document.getElementById('modal').classList.add('open');

  try {
    const res = await fetch(`${API_BASE}/api/links/${slug}/logs`, { headers: headers() });
    const json = await res.json();
    if (!res.ok) throw new Error(json.error);

    const logs = json.data;
    if (!logs.length) {
      document.getElementById('log-body').innerHTML = '<tr><td colspan="4" style="padding:1rem;text-align:center;color:var(--hint)">Belum ada klik.</td></tr>';
      return;
    }
    document.getElementById('log-body').innerHTML = logs.map(l => `
      <tr style="border-bottom:1px solid #f0ede8">
        <td style="padding:7px 10px">${fmtDate(l.clicked_at)}</td>
        <td style="padding:7px 10px;font-family:var(--mono)">${l.ip_address || '—'}</td>
        <td style="padding:7px 10px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${l.referer || '—'}</td>
        <td style="padding:7px 10px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:var(--hint)">${l.user_agent || '—'}</td>
      </tr>
    `).join('');
  } catch (e) {
    document.getElementById('log-body').innerHTML = `<tr><td colspan="4" style="padding:1rem;color:var(--danger)">Error: ${e.message}</td></tr>`;
  }
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
</script>
</body>
</html>
